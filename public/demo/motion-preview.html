<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Storybook Motion Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Great+Vibes&family=Italiana&family=Jost:wght@300;400;500&family=Petit+Formal+Script&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #1d1c19;
    color: #f3eee2;
    font-family: "Jost", sans-serif;
    font-weight: 300;
  }
  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.2rem clamp(1rem, 4vw, 2.5rem);
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  }
  .bar h1 { margin: 0; font-family: "Cormorant Garamond", serif; font-size: 1.35rem; font-weight: 400; letter-spacing: 0.04em; }
  .bar p { margin: 0.25rem 0 0; font-size: 0.72rem; letter-spacing: 0.08em; color: rgba(243, 238, 226, 0.6); }
  .bar button {
    border: 1px solid rgba(243, 238, 226, 0.3);
    border-radius: 999px;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 0.62rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    padding: 0.65rem 1.2rem;
    cursor: pointer;
  }
  .bar button:hover { background: rgba(243, 238, 226, 0.12); }
  .grid {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: center;
    gap: 2rem;
    max-width: 900px;
    margin: 0 auto;
    padding: clamp(1rem, 3vw, 1.75rem);
  }
  .device { width: 390px; max-width: 100%; margin: 0; }
  .frame {
    color: var(--ink);
    position: relative;
    width: 100%;
    height: 780px;
    overflow-x: hidden;
    overflow-y: auto;
    border-radius: 24px;
    background: var(--paper);
    box-shadow: 0 32px 70px -30px rgba(0, 0, 0, 0.8);
    scrollbar-width: none;
    overscroll-behavior: contain;
  }
  .frame::-webkit-scrollbar { display: none; }
  .device figcaption {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    margin-top: 0.8rem;
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(243, 238, 226, 0.58);
  }
  .device figcaption b { font-weight: 400; color: #f3eee2; }
  .device[data-variant="ivory"] {
    --paper: #f8f4ea; --paper2: #fcf9f1; --ink: #3e3a2f; --muted: #7e7767;
    --accent: #6e795c; --deep: #4b5440; --gold: #b49a6b; --sage: #8aa882;
    --display: "Cormorant Garamond", serif; --script: "Great Vibes", cursive;
    --line: rgba(126, 119, 103, 0.3); --line-soft: rgba(126, 119, 103, 0.16);
  }
  .device[data-variant="lakeside"] {
    --paper: #f4f6f2; --paper2: #fbfcf8; --ink: #2e3a3a; --muted: #6c7b78;
    --accent: #7f9bb5; --deep: #47657c; --gold: #b4a379; --sage: #8fa9a1;
    --display: "Cormorant Garamond", serif; --script: "Great Vibes", cursive;
    --line: rgba(71, 101, 124, 0.28); --line-soft: rgba(71, 101, 124, 0.14);
  }
  .device[data-variant="peony"] {
    --paper: #fbf5ef; --paper2: #fffaf6; --ink: #453831; --muted: #8a726a;
    --accent: #c9828f; --deep: #9d5b68; --gold: #b98f65; --sage: #9aa88b;
    --display: "Italiana", serif; --script: "Petit Formal Script", cursive;
    --line: rgba(157, 91, 104, 0.26); --line-soft: rgba(157, 91, 104, 0.14);
  }
  .device[data-variant="lantern"] {
    --paper: #1d2530; --paper2: #26313e; --ink: #f2e8d5; --muted: #b9ae97;
    --accent: #d9a85c; --deep: #a97a35; --gold: #e7c27a; --sage: #8fa08a;
    --display: "Italiana", serif; --script: "Petit Formal Script", cursive;
    --line: rgba(231, 194, 122, 0.28); --line-soft: rgba(231, 194, 122, 0.16);
  }

  .hero {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 780px;
    padding: 3.8rem 1.35rem 2.4rem;
    overflow: hidden;
    text-align: center;
    background:
      radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--paper2) 80%, transparent), transparent 70%),
      var(--paper);
  }
  .hero-editorial { justify-content: flex-start; padding-top: 4.6rem; }
  .flora, .garland, .life, .petals { position: absolute; inset: 0; pointer-events: none; }
  .flora { z-index: 1; }
  .life { z-index: 2; opacity: 0.9; }
  .garland { z-index: 0; }
  .petals { z-index: 1; overflow: hidden; }
  .hero-copy { position: relative; z-index: 3; width: min(34rem, 100%); }
  .greeting {
    margin: 0 0 1rem;
    font-size: 0.55rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .invite {
    max-width: 24rem;
    margin: 0 auto 1.5rem;
    font-family: var(--display);
    font-style: italic;
    font-size: 1rem;
    line-height: 1.7;
    color: var(--muted);
  }
  .names {
    margin: 0;
    font-family: var(--display);
    font-size: clamp(2.1rem, 7.4vw, 3.1rem);
    font-weight: 400;
    line-height: 1.06;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .names span { display: block; }
  .amp {
    display: block;
    margin: 0.18rem 0;
    font-family: var(--script);
    font-size: 1.8rem;
    line-height: 1.2;
    letter-spacing: 0;
    text-transform: none;
    color: var(--gold);
  }
  .date-line { margin: 1.4rem 0 0.3rem; font-family: var(--display); font-size: 1rem; letter-spacing: 0.26em; }
  .place { margin: 0; font-size: 0.56rem; letter-spacing: 0.32em; text-transform: uppercase; color: var(--muted); }
  .hero-note { position: relative; z-index: 3; margin: 1.2rem 0 0; font-family: var(--script); font-size: 1.25rem; color: var(--deep); }
  .hero-editorial .hero-note { display: none; }
  .scroll-cue {
    position: relative;
    z-index: 3;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 0.45rem;
    margin-top: 1.5rem;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.5rem;
    letter-spacing: 0.34em;
    text-transform: uppercase;
  }
  .scroll-cue i {
    width: 1px;
    height: 1.8rem;
    background: linear-gradient(to bottom, var(--accent), transparent);
    animation: cue 2.6s var(--ease) infinite;
  }
  .hero-scene {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 1;
    height: 47%;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 24%, #000 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, #000 24%, #000 100%);
  }
  .hero-scene img { width: 100%; height: 100%; object-fit: cover; object-position: center 56%; }
  .hero-scene::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, color-mix(in srgb, var(--paper) 96%, transparent) 0%, color-mix(in srgb, var(--paper) 42%, transparent) 34%, transparent 70%, color-mix(in srgb, var(--paper) 22%, transparent) 100%);
  }
  .flora img, .garland img, .wreath-img, .wf img {
    position: absolute;
    display: block;
    max-width: 100%;
    mix-blend-mode: multiply;
    filter: saturate(0.85);
  }
  .flora .l { top: -2.4rem; left: -2.8rem; width: 175px; transform: rotate(8deg); }
  .flora .r { top: -2rem; right: -2.8rem; width: 165px; transform: rotate(-6deg) scaleX(-1); }
  .device[data-variant="lakeside"] .flora .r { right: 0.8rem; width: 190px; transform: none; }
  .flora img { clip-path: inset(100% 0 0 0); animation: floralGrow 2.6s var(--ease) 0.2s forwards, breathe 14s ease-in-out 2.6s infinite alternate; }
  .flora .r { animation-delay: 0.5s, 2.9s; }
  .hero-scene img { animation: focusIn 2.1s var(--ease) both, breathe 18s ease-in-out 2.2s infinite alternate; }

  .garland .tl { top: -2.3rem; left: -2.8rem; width: 260px; transform: rotate(-7deg); }
  .garland .tr { top: -3rem; right: -3rem; width: 220px; transform: rotate(9deg); }
  .garland .bl { bottom: -3rem; left: -2.8rem; width: 205px; transform: rotate(12deg); }
  .garland .br { bottom: -3.2rem; right: -2.8rem; width: 180px; transform: rotate(-8deg) scaleX(-1); }
  .garland img { animation: garlandFloat 11s ease-in-out infinite alternate; }
  .garland .tr, .garland .bl { animation-delay: -3.5s; }
  .garland .br { animation-delay: -6.8s; }
  .hero-wash { position: absolute; inset: auto -8% 0 -8%; z-index: 0; height: 55%; opacity: 0.14; mix-blend-mode: multiply; pointer-events: none; }
  .hero-wash img { width: 100%; height: 100%; object-fit: cover; object-position: center 58%; }
  .device[data-variant="lantern"] .hero-wash { opacity: 0.32; mix-blend-mode: screen; }
  .device[data-variant="lantern"] .garland img,
  .device[data-variant="lantern"] .wreath-img,
  .device[data-variant="lantern"] .wf img { mix-blend-mode: screen; opacity: 0.44; filter: saturate(0.72) brightness(1.08); }
  .device[data-variant="lantern"] .hero-copy { color: var(--ink); }

  .wreath-wrap {
    position: relative;
    z-index: 2;
    display: grid;
    place-items: center;
    width: min(560px, 94vw);
    aspect-ratio: 1;
    margin: 0 auto;
  }
  .wreath-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transform: scale(0.92) rotate(-3deg);
    filter: blur(8px);
    animation: wreathIn 2.2s var(--ease) 0.2s both;
  }
  .wreath-copy { position: relative; z-index: 3; width: min(16rem, 48%); padding: 0 0.25rem; }
  .wreath-copy .greeting { margin-bottom: 0.7rem; font-size: 0.42rem; letter-spacing: 0.24em; color: var(--deep); }
  .wreath-copy .names { font-size: clamp(2.2rem, 7.4vw, 3.4rem); line-height: 1; letter-spacing: 0.04em; text-transform: none; }
  .wreath-copy .amp { margin: 0.08rem 0; font-size: 1.55rem; line-height: 1.15; color: var(--accent); }
  .wreath-copy .date-line { margin: 1rem 0 0.25rem; font-size: 0.76rem; letter-spacing: 0.2em; }
  .wreath-copy .place { font-size: 0.44rem; letter-spacing: 0.22em; }
  .wf { position: absolute; z-index: 2; display: block; opacity: 0; pointer-events: none; animation: bloomIn 1.5s var(--spring) both; }
  .wf-top { top: -11%; left: 52%; width: 26%; margin-left: -13%; --r: -14deg; animation-delay: 1.15s; }
  .wf-left { left: -6%; top: 44%; width: 21%; --r: 24deg; animation-delay: 1.35s; }
  .wf-right { right: -6%; top: 39%; width: 26%; --r: -158deg; animation-delay: 1.55s; }
  .wf img { width: 100%; animation: wfFloat 7.5s ease-in-out infinite alternate; }
  .wf-left img { animation-delay: -2.4s; }
  .wf-right img { animation-delay: -5s; }

  .lanterns { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .lantern {
    position: absolute;
    top: var(--top);
    left: var(--left);
    width: var(--w);
    height: calc(var(--w) * 1.5);
    transform-origin: 50% 0;
    animation: sway var(--dur) ease-in-out var(--delay) infinite alternate;
  }
  .lantern::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    width: 1px;
    height: 42%;
    background: color-mix(in srgb, var(--gold) 48%, transparent);
  }
  .lantern i {
    position: absolute;
    left: 0;
    top: 40%;
    width: 100%;
    height: 60%;
    border-radius: 42% 42% 48% 48%;
    background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--gold) 92%, #ffffff) 0%, var(--accent) 55%, color-mix(in srgb, var(--accent) 55%, #000000) 100%);
    box-shadow: 0 0 22px 6px color-mix(in srgb, var(--accent) 28%, transparent);
    animation: glow 4.5s ease-in-out var(--delay) infinite alternate;
  }
  .lantern i::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -22%;
    width: 1px;
    height: 24%;
    background: color-mix(in srgb, var(--gold) 45%, transparent);
  }

  .petal {
    position: absolute;
    top: -8%;
    left: var(--x);
    width: var(--s);
    height: calc(var(--s) * 0.68);
    border-radius: 60% 0 60% 0;
    background: var(--accent);
    opacity: 0;
    animation: fallPetal var(--dur) linear var(--delay) infinite;
  }
  .device[data-variant="lantern"] .petal { display: none; }

  .dust {
    position: absolute;
    left: var(--x);
    bottom: -6%;
    width: var(--s);
    height: var(--s);
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold);
    opacity: 0;
    animation: rise var(--dur) ease-out var(--delay) infinite;
  }

  .date-scene {
    position: relative;
    display: grid;
    place-items: start center;
    min-height: 780px;
    padding: 5.5rem 1.3rem;
    overflow: hidden;
    text-align: center;
  }
  .scene-bg { position: absolute; inset: 0; z-index: 0; }
  .scene-bg img { width: 100%; height: 100%; object-fit: cover; object-position: 68% 55%; filter: blur(10px); transform: scale(1.04); transition: filter 1.9s var(--ease), transform 1.9s var(--ease); }
  .date-scene.in .scene-bg img { filter: blur(0); transform: scale(1); }
  .date-scene::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    background:
      radial-gradient(78% 42% at 50% 42%, color-mix(in srgb, var(--paper) 78%, transparent) 0%, transparent 72%),
      linear-gradient(to bottom, color-mix(in srgb, var(--paper) 96%, transparent) 0%, color-mix(in srgb, var(--paper) 84%, transparent) 36%, color-mix(in srgb, var(--paper) 38%, transparent) 64%, color-mix(in srgb, var(--paper) 34%, transparent) 100%);
  }
  .scene-inner { position: relative; z-index: 3; width: min(32rem, 100%); }
  .arch { position: absolute; inset: 10px; z-index: 2; width: calc(100% - 20px); height: calc(100% - 20px); overflow: visible; pointer-events: none; }
  .arch path { fill: none; stroke: var(--gold); stroke-width: 1; opacity: 0.9; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 2.4s var(--ease) 0.25s; }
  .date-scene.in .arch path { stroke-dashoffset: 0; }
  .arch path + path { transition-delay: 0.55s; }
  .crest { position: absolute; top: 6px; left: 50%; z-index: 4; width: 44px; color: var(--gold); opacity: 0; transform: translate(-50%, -8px) scale(0.85); transition: opacity 1.1s var(--ease) 1s, transform 1.1s var(--spring) 1s; }
  .date-scene.in .crest { opacity: 0.9; transform: translate(-50%, 0) scale(1); }
  .kicker { margin: 0 0 0.55rem; font-size: 0.54rem; letter-spacing: 0.42em; text-transform: uppercase; color: var(--deep); }
  .title { margin: 0; font-family: var(--display); font-size: 2rem; font-weight: 400; letter-spacing: 0.16em; text-transform: uppercase; line-height: 1.25; }
  .ornament { position: relative; width: min(210px, 58%); height: 22px; margin: 1rem auto 0; }
  .ornament::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: linear-gradient(to right, transparent, var(--line), transparent); transform: scaleX(0); transition: transform 1.2s var(--ease) 0.25s; }
  .ornament::after { content: "❀"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -54%); padding: 0 0.5rem; background: var(--paper); color: var(--accent); font-size: 0.9rem; line-height: 1; }
  .in .ornament::before { transform: scaleX(1); }
  .month { margin: 0.45rem 0 1.2rem; font-family: var(--display); font-style: italic; font-size: 1.2rem; }
  .strip { display: flex; justify-content: center; align-items: flex-start; gap: 0.5rem; margin: 1.3rem auto 1.5rem; }
  .strip-day { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; width: 2.5rem; color: var(--muted); opacity: 0; transform: translateY(10px); transition: opacity 0.7s var(--ease), transform 0.7s var(--ease); }
  .date-scene.in .strip-day { opacity: 1; transform: none; }
  .date-scene.in .strip-day:nth-child(2) { transition-delay: 0.14s; }
  .date-scene.in .strip-day:nth-child(3) { transition-delay: 0.24s; }
  .date-scene.in .strip-day:nth-child(4) { transition-delay: 0.34s; }
  .date-scene.in .strip-day:nth-child(5) { transition-delay: 0.44s; }
  .date-scene.in .strip-day:nth-child(6) { transition-delay: 0.54s; }
  .date-scene.in .strip-day:nth-child(7) { transition-delay: 0.64s; }
  .strip-day span { font-size: 0.5rem; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.7; }
  .strip-day b { display: grid; place-items: center; width: 2.2rem; height: 2.2rem; border-radius: 50%; font-family: var(--display); font-size: 1.05rem; font-weight: 400; line-height: 1; }
  .strip-day.mark b { background: var(--deep); color: var(--paper2); font-size: 0.95rem; }
  .weekday { margin: 0; font-size: 0.58rem; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.75; }

  .date-calendar { position: relative; min-height: 780px; padding: 4.6rem 1.2rem; overflow: hidden; text-align: center; background: var(--paper); }
  .wreath-calendar { position: relative; display: grid; place-items: center; width: min(470px, 100%); aspect-ratio: 1; margin: 2rem auto 0; }
  .cal-wreath { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; opacity: 0.92; transform: scale(0.94) rotate(2deg); transition: transform 1.6s var(--ease), opacity 1.2s var(--ease); }
  .device[data-variant="lantern"] .cal-wreath { mix-blend-mode: screen; opacity: 0.4; }
  .in .cal-wreath { transform: scale(1) rotate(0); opacity: 1; animation: calBreathe 9s ease-in-out 1.8s infinite alternate; }
  .calendar {
    position: relative;
    z-index: 2;
    width: 53%;
    padding: 1rem 0.25rem 0.9rem;
    text-align: center;
    background: radial-gradient(circle at 50% 50%, var(--paper) 0 56%, color-mix(in srgb, var(--paper) 75%, transparent) 68%, transparent 78%);
  }
  .cal-month { margin: 0; font-family: var(--display); font-size: 1.35rem; letter-spacing: 0.14em; text-transform: uppercase; line-height: 1.1; }
  .cal-year { margin-top: 0.18rem; font-size: 0.52rem; letter-spacing: 0.36em; text-transform: uppercase; color: var(--muted); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.16rem 0.04rem; margin-top: 0.65rem; font-size: 0.6rem; }
  .cal-grid .dow { padding-bottom: 0.24rem; font-size: 0.44rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--deep); }
  .cal-grid .day { position: relative; display: grid; place-items: center; aspect-ratio: 1; border-radius: 50%; color: var(--muted); }
  .cal-grid .day.mark { background: var(--deep); color: var(--paper2); box-shadow: 0 7px 18px -9px color-mix(in srgb, var(--deep) 80%, transparent); opacity: 0.2; transform: scale(0.55); transition: opacity 0.8s var(--ease) 1.15s, transform 0.8s var(--spring) 1.15s; }
  .in .cal-grid .day.mark { opacity: 1; transform: scale(1); }
  .cal-grid .day.mark::after { content: "❀"; position: absolute; top: -0.48rem; left: 50%; transform: translateX(-50%); color: var(--accent); font-size: 0.42rem; }
  .date-note { max-width: 22rem; margin: 1rem auto 0; font-size: 0.78rem; line-height: 1.8; color: var(--muted); }

  .reveal > * { opacity: 0; transform: translateY(18px); filter: blur(4px); transition: opacity 0.9s var(--ease), transform 0.9s var(--ease), filter 0.9s var(--ease); }
  .reveal.in > * { opacity: 1; transform: none; filter: none; }
  .reveal.in > *:nth-child(2) { transition-delay: 0.1s; }
  .reveal.in > *:nth-child(3) { transition-delay: 0.18s; }
  .reveal.in > *:nth-child(4) { transition-delay: 0.26s; }
  .reveal.in > *:nth-child(5) { transition-delay: 0.34s; }
  .reveal.in > *:nth-child(6) { transition-delay: 0.42s; }

  :root {
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --spring: cubic-bezier(0.2, 1.3, 0.3, 1);
    --ink: #3e3a2f;
    --muted: #7e7767;
    --accent: #6e795c;
    --deep: #4b5440;
    --gold: #b49a6b;
    --line: rgba(126, 119, 103, 0.3);
    --paper: #f8f4ea;
    --paper2: #fcf9f1;
    --display: "Cormorant Garamond", serif;
    --script: "Great Vibes", cursive;
  }

  @keyframes focusIn { 0% { filter: blur(20px); transform: scale(1.06); opacity: 0; } 40% { opacity: 0.6; } 100% { filter: blur(0); transform: scale(1); opacity: 1; } }
  @keyframes breathe { from { scale: 1; } to { scale: 1.035; } }
  @keyframes garlandFloat { from { translate: 0 0; } to { translate: 0 7px; } }
  @keyframes wfFloat { from { translate: 0 0; } to { translate: 0 -7px; } }

<script>
  (function () {
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var devices = Array.prototype.slice.call(document.querySelectorAll(".device"));

    devices.forEach(function (device) {
      var frame = device.querySelector(".frame");
      var scene = device.querySelector(".date-scene, .date-calendar");
      var reveal = scene && scene.querySelector(".reveal");
      var px = Array.prototype.slice.call(device.querySelectorAll(".px"));
      var spins = Array.prototype.slice.call(device.querySelectorAll("[data-spin]"));

      if (!reduce) {
        frame.addEventListener("scroll", function () {
          var top = frame.scrollTop;
          px.forEach(function (el) {
            var speed = parseFloat(el.dataset.speed || "0");
            el.style.translate = "0 " + top * speed + "px";
          });
          spins.forEach(function (el) {
            var spin = parseFloat(el.dataset.spin || "0");
            el.style.rotate = top * spin + "deg";
          });
        }, { passive: true });
      }

      if (scene && reveal) {
        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            scene.classList.add("in");
            reveal.classList.add("in");
            observer.disconnect();
          });
        }, { root: frame, threshold: 0.25 });
        observer.observe(scene);
      }
    });

    document.getElementById("replay").addEventListener("click", function () {
      devices.forEach(function (device) {
        var frame = device.querySelector(".frame");
        var scene = device.querySelector(".date-scene, .date-calendar");
        var reveal = scene && scene.querySelector(".reveal");
        frame.scrollTop = 0;
        if (scene) scene.classList.remove("in");
        if (reveal) reveal.classList.remove("in");
        Array.prototype.slice.call(device.querySelectorAll(".px")).forEach(function (el) { el.style.translate = ""; });
        Array.prototype.slice.call(device.querySelectorAll("[data-spin]")).forEach(function (el) { el.style.rotate = ""; });
        var animated = Array.prototype.slice.call(device.querySelectorAll(".flora, .garland, .wreath-wrap, .hero-scene, .petals, .life, .lanterns"));
        animated.forEach(function (el) { el.style.animation = "none"; });
        void device.offsetWidth;
        animated.forEach(function (el) { el.style.animation = ""; });
      });
      window.setTimeout(function () {
        devices.forEach(function (device) {
          var frame = device.querySelector(".frame");
          var scene = device.querySelector(".date-scene, .date-calendar");
          if (!scene) return;
          if (scene.getBoundingClientRect().top < frame.getBoundingClientRect().bottom) {
            scene.classList.add("in");
            var reveal = scene.querySelector(".reveal");
            if (reveal) reveal.classList.add("in");
          }
        });
      }, 60);
    });
  })();
</script>
